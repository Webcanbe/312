<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>2027 Time Capsule</title>
  <meta name="description" content="A sealed message for 2027-01-01 00:00 KST." />
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050505;color:#f5f5f5;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(900px,100%);border:1px solid #242424;border-radius:28px;padding:clamp(28px,6vw,72px);background:linear-gradient(180deg,#0d0d0d,#080808);box-shadow:0 30px 120px rgba(0,0,0,.55)}
    .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#8c8c8c;margin-bottom:20px}.lock{font-size:46px;margin-bottom:20px}
    h1{font-size:clamp(34px,7vw,72px);line-height:.98;letter-spacing:-.05em;margin:0 0 24px}.sub{color:#a7a7a7;font-size:16px;line-height:1.65;max-width:680px}
    #countdown{font-variant-numeric:tabular-nums;font-size:clamp(26px,5vw,52px);letter-spacing:-.03em;margin:42px 0 10px}
    .meta{color:#727272;font-size:13px}.status{margin-top:36px;padding:14px 16px;border:1px solid #222;border-radius:14px;background:#0b0b0b;color:#bdbdbd}
    article{display:none;margin-top:40px;border-top:1px solid #222;padding-top:36px;white-space:pre-wrap;line-height:1.85;font-size:17px;color:#e7e7e7}
    .ok{color:#c9ffd8}.err{color:#ffb7b7}
  </style>
</head>
<body>
<main>
  <div class="eyebrow">SEALED · 2026-09-28</div>
  <div class="lock">⌛</div>
  <h1>For 2027.</h1>
  <p class="sub">이 저장소에는 원문이 없습니다. 공개된 것은 암호문뿐이며, 해제 키가 게시되기 전에는 프런트엔드 코드를 바꾸거나 시스템 시간을 조작해도 원문을 복호화할 수 없습니다.</p>
  <div id="countdown">—</div>
  <div class="meta">Unlock target: 2027-01-01 00:00:00 KST</div>
  <div id="status" class="status">암호문을 불러오는 중…</div>
  <article id="message"></article>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
